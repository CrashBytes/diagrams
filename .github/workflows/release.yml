name: Release

on:
  push:
    tags:
      - 'v*'

# CRITICAL: Required for npm Trusted Publishing (OIDC authentication)
permissions:
  contents: write  # Needed to create GitHub releases
  id-token: write  # Needed for npm provenance/trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # NO registry-url - prevents .npmrc conflicts with OIDC

      - name: Upgrade npm for Trusted Publishing (needs >= 11.5.1)
        run: |
          npm install -g npm@latest
          echo "npm now: $(npm --version)  node: $(node --version)"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Debug OIDC availability
        run: |
          echo "ID_TOKEN_URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
          echo "ID_TOKEN_TOKEN present: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+YES}"

      - name: Publish to npm with Provenance
        run: |
          echo "publish using npm $(npm --version) on node $(node --version)"
          npm publish --provenance --access public --loglevel verbose
        # OIDC authentication via GitHub Actions - no tokens needed!

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
